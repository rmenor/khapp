schema: spec-driven

context: |
  Tech stack: Next.js 16.1.1, React 18, Firebase 10.12 (resto de dominios),
  SQLite local via node:sqlite (dominio de contabilidad), Tailwind CSS
  Architecture: App Router (with (app) layout), Server Actions, Route Handlers
  Testing: vitest
  Style: eslint ., tsc --noEmit

rules:
  proposal:
    - Define clear schema requirements for the entities of the change
  specs:
    - Specify user scenarios in Given/When/Then, in Spanish
  design:
    - Design the data structures (SQLite tables or Firestore collections)
    - Document Server Actions, route handlers and UI layout
  tasks:
    - Break down tasks into model additions, server actions, navigation, and frontend page layouts
  apply:
    - Follow clean Next.js patterns, use shadcn/ui components, and zod validation
    - strict_tdd: false
  verify:
    - Manual verification via browser page testing
    - Run linter, type-checker and test suite
